name: PR Verification Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      run_e2e:
        description: "Also run browser E2E tests (Playwright)?"
        required: false
        default: true
        type: boolean
      pr_number:
        description: "PR number (optional, set when called from agent-pr.yml)"
        required: false
        type: string
      ref:
        description: "Branch/ref to verify (set when called from agent-pr.yml)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # pull_request: empty => default PR merge commit; workflow_call: the agent branch
          ref: ${{ inputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install project dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          mkdir -p .test-reports
          npm run typecheck 2>&1 | tee .test-reports/typecheck.log

      - name: Lint
        id: lint
        shell: bash
        run: |
          mkdir -p .test-reports
          npm run lint 2>&1 | tee .test-reports/lint.log

      - name: Unit & integration tests
        id: unit_tests
        shell: bash
        run: |
          mkdir -p .test-reports
          npm test 2>&1 | tee .test-reports/unit-tests.log

      - name: Build
        id: build
        shell: bash
        run: |
          mkdir -p .test-reports
          npm run build 2>&1 | tee .test-reports/build.log

      - name: Install Playwright Chromium & system deps
        if: ${{ inputs.run_e2e != false }}
        run: |
          if [ -x node_modules/.bin/playwright ]; then
            npx --no-install playwright install --with-deps chromium
          else
            echo "Playwright is not a project dependency yet – skipping browser install."
          fi

      - name: E2E tests (Playwright)
        id: e2e_tests
        if: ${{ inputs.run_e2e != false }}
        shell: bash
        run: |
          mkdir -p .test-reports
          if npm run | grep -q "test:e2e"; then
            npm run test:e2e 2>&1 | tee .test-reports/e2e.log
          else
            echo "Script 'test:e2e' is not defined in package.json – skipped." | tee .test-reports/e2e.log
          fi

      - name: Write verification summary to GitHub Step Summary
        if: always()
        run: |
          {
            echo "## Independent PR verification (\`pr-checks.yml\`)"
            echo ""
            echo "- **Typecheck:** \`${{ steps.typecheck.outcome || 'skipped' }}\`"
            echo "- **Lint:** \`${{ steps.lint.outcome || 'skipped' }}\`"
            echo "- **Unit & integration tests:** \`${{ steps.unit_tests.outcome || 'skipped' }}\`"
            echo "- **Build:** \`${{ steps.build.outcome || 'skipped' }}\`"
            echo "- **E2E tests:** \`${{ steps.e2e_tests.outcome || 'skipped' }}\`"
            echo ""
            for log_file in .test-reports/*.log; do
              [ -f "$log_file" ] || continue
              echo "### Output: \`$(basename "$log_file")\`"
              echo '```text'
              tail -n 60 "$log_file"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-verification-reports-${{ github.run_id }}
          path: |
            .test-reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
